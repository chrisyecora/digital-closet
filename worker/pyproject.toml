[tool.poetry]
name = "digital-closet-worker"
version = "0.1.0"
description = ""
package-mode = false
authors = ["chrisyecora <chris.yecora@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pillow = "*"
"numpy" = "<2"
"psycopg2-binary" = "*"
"pgvector" = "*"
"boto3" = "*"
"python-dotenv" = "*"
"torch" = "==2.2.2"
"torchvision" = "==0.17.2"
"transformers" = "<4.40.0"
"pydantic-settings" = ">=2.13.1,<3.0.0"
"pillow-heif" = ">=1.3.0,<2.0.0"
"opencv-contrib-python" = "<4.11"
"sqlalchemy" = ">=2.0.48,<3.0.0"
"ultralytics" = ">=8.4.26,<9.0.0"
anthropic = "^0.97.0"
email-validator = "^2.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
"scipy" = ">=1.17.1,<2.0.0"
pytest = "^9.0.3"
